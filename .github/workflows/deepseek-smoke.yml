name: DeepSeek smoke test

on:
  workflow_dispatch:
  # Weekly check, Mondays at 13:07 UTC. Uncomment to enable.
  # schedule:
  #   - cron: "7 13 * * 1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check DEEPSEEK_API_KEY secret is present
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Repository secret DEEPSEEK_API_KEY is not set. Add it under Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

      - name: Run smoke test
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: python scripts/chat.py "Reply with exactly: DEEPSEEK_OK"
